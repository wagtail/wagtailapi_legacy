[project]
name = "wagtailapi-legacy"
version = "0.1.0"
description = "Legacy versions of the Wagtail API that are no longer maintained in Wagtail core"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
    # Update this based on your project's status.
    # See: https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
]
# See: https://devguide.python.org/versions/#supported-versions
requires-python = ">=3.11"
dependencies = [
    # https://www.djangoproject.com/download/#supported-versions
    "django>=5.2",
    # https://github.com/wagtail/wagtail/wiki/Release-schedule
    # https://docs.wagtail.org/en/latest/releases/upgrading.html#compatible-django-python-versions
    "wagtail>=7.0",
]

[project.urls]
Homepage = "https://github.com/org-name-or-username/wagtailapi-legacy"
Repository = "https://github.com/org-name-or-username/wagtailapi-legacy"
Changelog = "https://github.com/org-name-or-username/wagtailapi-legacy/blob/main/CHANGELOG.md"
Documentation = "https://github.com/org-name-or-username/wagtailapi-legacy/tree/main/docs"
Issues = "https://github.com/org-name-or-username/wagtailapi-legacy/issues"
# Add funding link if needed.
# Funding = "https://github.com/org-name-or-username/wagtailapi-legacy"

[dependency-groups]
dev = [
    "dj-database-url>=3.1.2",
    "pytest>=8.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.9",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagtailapi_legacy"
source-exclude = [
    "wagtailapi_legacy/static_src",
    "wagtailapi_legacy/test",
    "wagtailapi_legacy/static/wagtailapi_legacy/js/.gitignore",
    "testmanage.py",
    ".*",
    "*.js",
    "*.json",
    "*.ini",
    "*.yml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wagtailapi_legacy.test.settings"
testpaths = ["tests"]
